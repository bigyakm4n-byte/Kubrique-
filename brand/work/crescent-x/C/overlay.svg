<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Crescent X mark">
  <title>overlay</title>
  <!--
    CRESCENT X - construction C.  Three variable-width strokes drawn as outlines.
    ring-crescent: circle R=220 minus an inner ellipse (212.96 x 201.3) pushed 24.86 toward the mouth
                   (two arcs; the band thins to sharp horns at 127.08 / -133.08 deg).
    ring-x1: descending ring, +36 deg.  A slim lens ellipse (220 x 23.1) offset outward by a smooth
             width function: 49.5 on the lower-left edge, fading to a 1.32 hairline on the upper-right
             edge, 9.9 at the tips; with a shallow bend and sway so the heavy band runs through the X
             centre (cubic Bezier outline generated by gen_mark.py).
    ring-x2: ascending ring, -34 deg.  Outer ellipse (221.1 x 55) minus a lens (204.6 x 34.1)
             offset 2.64 toward the lower-right edge and turned -2 deg (four arcs, evenodd).
    Weave gaps are background strokes (17.6 wide, i.e. 8.8 each side) applied as masks:
      crescent  <- under x1 and x2 (tips at lower-right / upper-right)
      x2        <- under x1's thick band (centre)
      x1        <- its hairline far edge passes under x2 (x2 threads through x1)
    Recolour: change the fill on #mark.
  -->
