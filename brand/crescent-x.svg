<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Crescent X, the Kubrique logo mark: two crossed crystal bands inside a crescent ring">
  <title>Crescent X</title>
  <style>
    .ring  { transform-box: view-box; transform-origin: 256px 256px; animation: spin-cw 36s linear infinite; }
    .cross { transform-box: view-box; transform-origin: 256px 256px; animation: spin-ccw 54s linear infinite; }
    .pulse { animation: pulse 6s ease-in-out infinite; }
    @keyframes spin-cw  { to { transform: rotate(360deg); } }
    @keyframes spin-ccw { to { transform: rotate(-360deg); } }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .ring, .cross, .pulse { animation: none; }
    }
  </style>
  <defs>
    <!-- Colour cycle shared by the ring and the band edges: gold, rose, violet, teal, gold -->
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d58a">
        <animate attributeName="stop-color" dur="24s" repeatCount="indefinite"
          values="#f1d58a;#f4b6b0;#c9b2f2;#9fdcd9;#f1d58a"/>
      </stop>
      <stop offset="0.5" stop-color="#b98a2e">
        <animate attributeName="stop-color" dur="24s" repeatCount="indefinite"
          values="#b98a2e;#c25c7a;#6b4fc4;#2f8f93;#b98a2e"/>
      </stop>
      <stop offset="1" stop-color="#f7e6b4">
        <animate attributeName="stop-color" dur="24s" repeatCount="indefinite"
          values="#f7e6b4;#fbd3d3;#e0d4ff;#c5f0ee;#f7e6b4"/>
      </stop>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#d8c79a" stop-opacity="0.18"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.5"  stop-color="#d8c79a" stop-opacity="0.22"/>
      <stop offset="0.7"  stop-color="#ffffff" stop-opacity="0.50"/>
      <stop offset="1"    stop-color="#d8c79a" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d6" stop-opacity="0.9">
        <animate attributeName="stop-color" dur="24s" repeatCount="indefinite"
          values="#fff6d6;#ffe4e6;#ece2ff;#dcf7f5;#fff6d6"/>
      </stop>
      <stop offset="1" stop-color="#fff6d6" stop-opacity="0"/>
    </radialGradient>
    <!-- Crescent: outer disc with an offset inner disc cut away -->
    <mask id="crescent">
      <circle cx="256" cy="256" r="200" fill="#fff"/>
      <circle cx="279" cy="272" r="178" fill="#000"/>
    </mask>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Bulb glow at the centre -->
  <circle class="pulse" cx="256" cy="256" r="110" fill="url(#glow)" filter="url(#soft)"/>

  <!-- Crescent ring -->
  <g class="ring">
    <circle cx="256" cy="256" r="200" fill="url(#metal)" mask="url(#crescent)"/>
    <!-- thin inner rim, like the chandelier's second hoop -->
    <circle cx="256" cy="256" r="186" fill="none" stroke="url(#metal)" stroke-width="1.5" opacity="0.6" mask="url(#crescent)"/>
  </g>

  <!-- Crossed crystal bands -->
  <g class="cross">
    <!-- back band -->
    <g transform="rotate(-45 256 256)">
      <rect x="106" y="220" width="300" height="72" rx="6" fill="url(#glass)" stroke="url(#metal)" stroke-width="3"/>
      <path d="M136 220v72M196 220v72M256 220v72M316 220v72M376 220v72" stroke="#b98a2e" stroke-opacity="0.45" stroke-width="1"/>
      <path d="M106 256h300" stroke="#b98a2e" stroke-opacity="0.25" stroke-width="1"/>
    </g>
    <!-- front band -->
    <g transform="rotate(45 256 256)">
      <rect x="106" y="220" width="300" height="72" rx="6" fill="url(#glass)" stroke="url(#metal)" stroke-width="3"/>
      <path d="M136 220v72M196 220v72M256 220v72M316 220v72M376 220v72" stroke="#b98a2e" stroke-opacity="0.45" stroke-width="1"/>
      <path d="M106 256h300" stroke="#b98a2e" stroke-opacity="0.25" stroke-width="1"/>
    </g>
    <!-- bulb socket -->
    <circle cx="256" cy="256" r="9" fill="#1b1a17" stroke="url(#metal)" stroke-width="2"/>
  </g>
</svg>
