<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <title>KUBRIQUE - Crescent X</title>
  <defs>
    <!-- visible outlines of the rings (exact arcs); reused by the masks as cut shapes -->
    <path id="cx-crescent" fill-rule="nonzero" d="M133.24 75.15 A222 222 0 1 1 133.24 436.85 A209.5 209.5 0 1 0 133.24 75.15 Z"/>
    <path id="cx-x1" fill-rule="nonzero" d="M627.56 429.19 A342 72 26 1 1 320.24 205.32 A411 47.5 23.4 1 0 627.56 429.19 Z"/>
    <path id="cx-x2" fill-rule="evenodd" d="M425.3 144.56 A230 54.8 -32.4 0 1 36.9 391.04 A230 54.8 -32.4 0 1 425.3 144.56 Z M392.08 162 A197.3 35.1 -34.2 0 1 65.72 383.8 A197.3 35.1 -34.2 0 1 392.08 162 Z"/>
    <!-- weave gaps: each under-ring is cut by the over-ring's outline, stroked 2*GAP wide -->
    <mask id="cx-under-x1" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <use xlink:href="#cx-x1" fill="#000" stroke="#000" stroke-width="15" stroke-linejoin="round"/>
    </mask>
    <mask id="cx-under-x1-x2" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <use xlink:href="#cx-x1" fill="#000" stroke="#000" stroke-width="15" stroke-linejoin="round"/>
      <use xlink:href="#cx-x2" fill="#000" stroke="#000" stroke-width="15" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g id="mark" fill="#F3E7C3">
    <use id="ring-crescent" xlink:href="#cx-crescent" mask="url(#cx-under-x1-x2)"/>
    <use id="ring-x2" xlink:href="#cx-x2" mask="url(#cx-under-x1)"/>
    <use id="ring-x1" xlink:href="#cx-x1"/>
  </g>
</svg>
